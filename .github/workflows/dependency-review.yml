name: Dependency Review

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
        # Repository owners must enable Dependency Graph for this advisory job.

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit application and test requirements
        run: pip-audit -r requirements.txt -r requirements-dev.txt --format json --output pip-audit.json
        continue-on-error: true
      - name: Save dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit.json

# Dependency changes require human review. Group names and PR titles do not
# establish dependency type, patch-only changes or a successful security audit.
