version: 2
updates:
  # pip (Python data platform) - Combined production and dev dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "data-platform"
    groups:
      # Group patch updates (bug fixes) - safe to merge together
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
        exclude-patterns:
          - "*rc*"
          - "*beta*"
          - "*alpha*"
          - "*dev*"
      # Group security-critical packages - require individual review
      security-critical:
        patterns:
          - "pyjwt"
          - "cryptography"
          - "sqlalchemy"
          - "alembic"
          - "requests"
          - "pandas"
        update-types:
          - "minor"
          - "patch"
      # Group development dependencies
      dev-dependencies:
        patterns:
          - "pytest*"
          - "coverage*"
          - "black"
          - "flake8"
          - "mypy"
          - "isort"
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Docker base image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-base:
        patterns:
          - "python:*"
          - "postgres:*"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci-cd"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
